services:
  scanbase:
    container_name: scanbase
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_PATH: /data/scanbase.db
      USB_SYSFS_DEVICES: /sys/bus/usb/devices
      USB_HID_DRIVER_DIR: /host-usbhid
    # Required for usbfs access and to detach/re-attach only the scanner's
    # keyboard interface. Use only on a trusted home LAN.
    privileged: true
    volumes:
      - ./data:/data
      - /dev/bus/usb:/dev/bus/usb
      - /sys/bus/usb/devices:/sys/bus/usb/devices:ro
      - /sys/bus/usb/drivers/usbhid:/host-usbhid:rw
