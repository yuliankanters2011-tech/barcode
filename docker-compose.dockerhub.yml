services:
  scanbase:
    # Image wordt door GitHub Actions naar Docker Hub gepubliceerd.
    image: docker.io/ykdigital/scanbase:latest
    container_name: scanbase
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      DB_PATH: /data/scanbase.db
      SCANNER_MODE: external
    volumes:
      - /volume1/docker/scanbase/data:/data
